[package]
name = "payments-engine"
version = "0.1.0"
edition = "2021"
description = "Toy streaming payments engine: reads transactions from CSV, prints client balances as CSV"

[dependencies]
csv = "1.3"
serde = { version = "1", features = ["derive"] }
rust_decimal = "1.33"
thiserror = "1"

[dev-dependencies]
assert_cmd = "2"
proptest = "1"

[profile.release]
lto = true
codegen-units = 1
